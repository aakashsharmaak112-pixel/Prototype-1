<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prototype-1 | Kotak TOTP Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 40px auto;
      padding: 20px;
    }

    h2 {
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 22px;
      letter-spacing: 5px;
      text-align: center;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h2>Kotak Neo TOTP Test</h2>

  <p>
    Google Authenticator se current 6-digit TOTP enter karo.
  </p>

  <input
    id="totp"
    type="text"
    inputmode="numeric"
    maxlength="6"
    autocomplete="one-time-code"
    placeholder="000000"
  />

  <button onclick="testLogin()">
    Test Kotak Login
  </button>

  <div id="status"></div>

  <script>

    async function testLogin() {

      const input =
        document.getElementById("totp");

      const status =
        document.getElementById("status");

      const totp =
        input.value.trim();

      if (!/^\d{6}$/.test(totp)) {

        status.textContent =
          "Please enter the current 6-digit TOTP.";

        return;
      }

      status.textContent =
        "Testing Kotak Neo...";

      try {

        const response =
          await fetch("/api/neo-login-test", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              totp: totp
            })

          });

        const data =
          await response.json();

        status.textContent =
          JSON.stringify(data, null, 2);

        input.value = "";

      } catch (error) {

        status.textContent =
          "Request failed: " +
          error.message;

      }
    }

  </script>

</body>
</html>
