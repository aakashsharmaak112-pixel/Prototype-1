<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype-1 | Kotak MPIN Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 420px;
      margin: 40px auto;
      padding: 20px;
    }

    h2 {
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h2>Kotak Neo MPIN Test</h2>

  <p>
    Vercel environment se configured MPIN use hoga.
  </p>

  <button onclick="testMpin()">
    Test MPIN Validation
  </button>

  <div id="status"></div>

  <script>

    async function testMpin() {

      const status =
        document.getElementById("status");

      status.textContent =
        "Validating MPIN with Kotak Neo...";

      try {

        const response =
          await fetch("/api/neo-mpin-test", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({})
          });

        const data =
          await response.json();

        status.textContent =
          JSON.stringify(data, null, 2);

      } catch (error) {

        status.textContent =
          "Request failed: " +
          error.message;

      }
    }

  </script>

</body>
</html>
