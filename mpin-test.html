<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype-1 | Kotak MPIN Test</title>
</head>

<body>

  <h2>Kotak Neo MPIN Test</h2>

  <p>Current Google Authenticator TOTP enter karo:</p>

  <input
    id="totp"
    type="text"
    inputmode="numeric"
    maxlength="6"
    placeholder="6-digit TOTP"
  >

  <button onclick="testLogin()">
    Test TOTP + MPIN
  </button>

  <pre id="status"></pre>

  <script>

    async function testLogin() {

      const totp =
        document.getElementById("totp").value.trim();

      const status =
        document.getElementById("status");

      if (!/^\d{6}$/.test(totp)) {
        status.textContent =
          "Please enter current 6-digit TOTP.";
        return;
      }

      status.textContent =
        "Testing...";

      try {

        const response =
          await fetch("/api/neo-mpin-test", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              totp: totp
            })
          });

        const data =
          await response.json();

        status.textContent =
          JSON.stringify(data, null, 2);

      } catch (error) {

        status.textContent =
          "Request failed: " + error.message;

      }
    }

  </script>

</body>
</html>
